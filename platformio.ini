; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; NOTE: Multi-target builds use idf.py directly via build_all_targets.sh (IDF 5.5.4).
; This file is for IDE integration and single-target PlatformIO builds.

[platformio]
src_dir = main

[env]
platform = espressif32@^6.8.0
framework = espidf
board_build.partitions = partitions_example.csv
monitor_filters = direct
monitor_speed = 115200

[env:esp32dev]
board = esp32dev
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c3"

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3"

; [env:esp32-s3-debug]
; extends = env:esp32-s3-devkitc-1
; upload_protocol = esp-builtin
; debug_tool = esp-builtin
; build_type = debug

[env:esp32-c5-devkitc-1]
board = esp32-c5-devkitc-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c5"

[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c6"

[env:wt32-eth01]
board = wt32-eth01
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.eth_common;sdkconfig.defaults.wt32_eth01"
    -DSDKCONFIG=sdkconfig.eth

; Waveshare ESP32-S3-ETH / ESP32-S3-POE-ETH(-M): 16 MB flash, 8 MB octal PSRAM.
; ROUTER_NAPT_MAX: lwIP searches the NAT table linearly per packet, so more
; entries cost speed once they're in use. 1024 = twice the default.
[waveshare_s3_eth]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Ethernet uplink through the board's onboard WIZnet W5500 over SPI (the S3 has
; no built-in RMII EMAC, see Kconfig.projbuild).
[env:esp32-s3-eth-w5500]
extends = waveshare_s3_eth
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.esp32s3_w5500;sdkconfig.defaults.waveshare_s3_eth"
    -DROUTER_NAPT_MAX=1024

; USB 4G modem as uplink on the chip's native USB port (now a USB host). Console
; moves to UART0 (IO43/IO44). Mode 1: PPP / AT-command modems (Quectel, SIMCom...):
[env:esp32-s3-usb-modem-ppp]
extends = waveshare_s3_eth
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3_usb_modem;sdkconfig.defaults.usb_modem_ppp;sdkconfig.defaults.waveshare_s3_eth"
    -DEXTRA_COMPONENT_DIRS=usb_modem_components
    -DROUTER_NAPT_MAX=1024

; Mode 2: network-card modems, RNDIS / CDC-ECM (Huawei E3372h HiLink...):
[env:esp32-s3-usb-modem-net]
extends = waveshare_s3_eth
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3_usb_modem;sdkconfig.defaults.usb_modem_net;sdkconfig.defaults.waveshare_s3_eth"
    -DEXTRA_COMPONENT_DIRS=usb_modem_components
    -DROUTER_NAPT_MAX=1024

; Same board with Wi-Fi as the internet source (other Wi-Fi networks, WPA2-Enterprise).
; The Ethernet port is unused in this build.
[env:esp32-s3-eth-wifi-uplink]
extends = waveshare_s3_eth
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.waveshare_s3_eth"
    -DROUTER_NAPT_MAX=1024
